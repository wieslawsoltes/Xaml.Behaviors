name: CI
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
    - master
    - release/*
  pull_request:
    branches:
    - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
          8.0.x
          6.0.x

    - name: Build Release
      run: dotnet build AvaloniaBehaviors.slnx --configuration Release

    - name: Test Release
      run: dotnet test AvaloniaBehaviors.slnx --configuration Release

    - name: Check Documentation
      if: matrix.os == 'ubuntu-latest'
      run: |
        chmod +x ./check-docs.sh
        ./check-docs.sh

    - name: Pack NuGet
      if: matrix.os == 'ubuntu-latest'
      run: dotnet run --project build/build/_build.csproj --target Pack --configuration Release

    - name: Upload NuGet artifacts
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: artifacts/NuGet
        if-no-files-found: error

  uno:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Uno ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x

    - name: Build Uno Release
      run: dotnet build UnoBehaviors.slnx --configuration Release

    - name: Test Uno Release
      run: dotnet test UnoBehaviors.slnx --configuration Release --no-build

    - name: Pack Uno NuGet
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack UnoBehaviors.slnx --configuration Release --no-build --output artifacts/NuGet.Uno

    - name: Upload Uno NuGet artifacts
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages-uno
        path: artifacts/NuGet.Uno
        if-no-files-found: error

  winui:
    name: WinUI windows-latest
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x

    - name: Build WinUI Release
      run: dotnet build WinUIBehaviors.slnx --configuration Release

    # The WinUI tests show a real window and inject real input (WinUI has no headless mode).
    - name: Test WinUI Release
      shell: pwsh
      run: build/WinUIPort/run-tests.ps1 -Results artifacts/winui-tests

    - name: Upload WinUI test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: winui-test-results
        path: artifacts/winui-tests
        if-no-files-found: warn

    - name: Pack WinUI NuGet
      run: dotnet pack WinUIBehaviors.slnx --configuration Release --no-build --output artifacts/NuGet.WinUI

    - name: Upload WinUI NuGet artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages-winui
        path: artifacts/NuGet.WinUI
        if-no-files-found: error
