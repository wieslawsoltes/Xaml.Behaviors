name: GitHub Release

on:
  push:
    tags:
    - v*
    - release/*
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing Git tag to release (for example v12.2.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
    - name: Resolve release tag
      id: release
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        INPUT_TAG: ${{ inputs.tag_name }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run the release workflow from the default branch."
            exit 1
          fi
          tag="$INPUT_TAG"
        else
          tag="$GITHUB_REF_NAME"
        fi

        if ! git check-ref-format "refs/tags/$tag"; then
          echo "::error::Enter a valid Git tag name."
          exit 1
        fi

        case "$tag" in
          *-alpha*|*-beta*|*-rc*|*-preview*) prerelease=true ;;
          *) prerelease=false ;;
        esac
        printf 'tag=%s\nprerelease=%s\n' "$tag" "$prerelease" >> "$GITHUB_OUTPUT"

    - name: Check out the release commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', steps.release.outputs.tag) || github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          10.0.x
          8.0.x
          6.0.x

    - name: Pack
      run: dotnet run --project build/build/_build.csproj --target Pack --configuration Release

    - name: Upload NuGet packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nuget-packages
        path: |
          artifacts/NuGet/*.nupkg
          artifacts/NuGet/*.snupkg
        if-no-files-found: error

  publish:
    name: Publish to NuGet.org
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      id-token: write

    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: nuget-packages
        path: artifacts/NuGet

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - name: Log in to NuGet.org
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push NuGet packages and symbols
      env:
        NUGET_PUBLISH_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        if [[ -z "$NUGET_PUBLISH_KEY" ]]; then
          echo "::error::NuGet login did not return a publishing key."
          exit 1
        fi

        shopt -s nullglob
        packages=(artifacts/NuGet/*.nupkg)
        if (( ${#packages[@]} == 0 )); then
          echo "::error::No NuGet packages found in artifacts/NuGet."
          exit 1
        fi

        push_options=(--source https://api.nuget.org/v3/index.json --api-key "$NUGET_PUBLISH_KEY" --skip-duplicate)
        for package in "${packages[@]}"; do
          dotnet nuget push "$package" "${push_options[@]}" --no-symbols
        done

        # Push symbols separately so a retry can recover a missing symbol upload.
        for package in artifacts/NuGet/*.snupkg; do
          dotnet nuget push "$package" "${push_options[@]}"
        done

  release:
    name: Create GitHub Release
    needs: [pack, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: nuget-packages
        path: artifacts/NuGet

    - name: Create GitHub release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        tag_name: ${{ needs.pack.outputs.tag }}
        name: Xaml.Behaviors ${{ needs.pack.outputs.tag }}
        draft: false
        prerelease: ${{ needs.pack.outputs.prerelease == 'true' }}
        files: |
          artifacts/NuGet/*.nupkg
          artifacts/NuGet/*.snupkg
